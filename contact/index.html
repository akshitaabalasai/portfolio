<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Akshitaa Balasai</title>
  <meta name="description" content="Get in touch with Akshitaa Balasai." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='.5' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    form.contact {
      max-width: 700px;
      margin-top: 1rem;
    }
    form.contact div {
      margin-bottom: 1rem;
    }
    #send-status {
      font-size: 0.85rem;
      margin-top: 0.75rem;
      opacity: 0.8;
    }
    #send-status[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <h1 class="gradient-text">Contact Me</h1>
  <p class="hero-tagline">Have a question, opportunity, or just want to say hi? Send a message below or reach out directly.</p>

  <div class="links">
    <a class="pill" href="mailto:akshitaabalasai@gmail.com">Email</a>
    <a class="pill" href="https://www.linkedin.com/in/akshitaabalasai" target="_blank" rel="noopener">LinkedIn</a>
    <a class="pill" href="https://github.com/akshitaabalasai" target="_blank" rel="noopener">GitHub</a>
  </div>

  <form id="contact-form" class="contact" data-to="akshitaabalasai@gmail.com">
    <div>
      <label>
        Email:
        <input value="akshitaabalasai@gmail.com" readonly />
      </label>
    </div>

    <div>
      <label>
        Subject:
        <input name="subject" required placeholder="What’s up?" />
      </label>
    </div>

    <div>
      <label>
        Message:
        <textarea name="body" rows="5" required placeholder="Write your message here…"></textarea>
      </label>
    </div>

    <div>
      <a id="send-link" class="pill pill-accent" href="#" target="_blank" rel="noopener">Send</a>
    </div>

    <p id="send-status" hidden>Opening your email app…</p>
  </form>

  <script type="module" src="../global.js"></script>
</body>
</html>
