<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meta – Code stats</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='.5' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />

  <!-- shared site styles if you have them -->
  <link rel="stylesheet" href="../style.css?v=3" />
  <!-- page-specific styles -->
  <link rel="stylesheet" href="./meta.css?v=2" />
</head>
<body>

<main class="page">
  <h1>Meta</h1>
  <p class="note">Stats and interactives computed from <code>meta/loc.csv</code>.</p>

  <!-- Time slider -->
  <div id="time-filter">
    <label for="commit-progress">
      Show commits until:
      <input type="range" id="commit-progress" min="0" max="100" value="100" />
    </label>
    <time id="commit-time" aria-live="polite"></time>
  </div>

  <!-- Summary tiles -->
  <section id="stats" aria-label="Summary stats">
    <div class="stats">
      <div class="tile">
        <div class="label">Total LOC</div>
        <div id="stat-total" class="value">–</div>
      </div>
      <div class="tile">
        <div class="label">Commits</div>
        <div id="stat-commits" class="value">–</div>
      </div>
      <div class="tile">
        <div class="label">Files</div>
        <div id="stat-files" class="value">–</div>
      </div>
      <div class="tile">
        <div class="label">Longest line</div>
        <div id="stat-longest" class="value">–</div>
      </div>
      <div class="tile">
        <div class="label">Max lines</div>
        <div id="stat-maxlines" class="value">–</div>
      </div>
    </div>
  </section>

  <h2>Commits by time of day</h2>

  <!-- Scrollytelling container -->
  <div id="scrolly-1">
    <div id="scatter-story">
      <!-- JS will populate .step divs here -->
    </div>

    <div id="scatter-plot">
      <div
        id="chart"
        role="img"
        aria-label="Commits by time of day bubble chart"
      ></div>
      <p id="selection-count" class="note">All commits shown</p>
    </div>
  </div>

  <!-- Unit visualization of files -->
  <h2>File “race” over time</h2>
  <dl id="files"></dl>
</main>

<!-- Page logic -->
<script type="module" src="../global.js?v=3"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
